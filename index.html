<!DOCTYPE html> 
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fotografía Inmobiliaria · Profesional</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #ffffff;
    --text: #111;
    --soft: #666;
    --accent: #000;
    --border: #eaeaea;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
}

/* HEADER */
header {
    position: sticky;
    top: 0;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    z-index: 100;
}

nav {
    max-width: 1200px;
    margin: auto;
    padding: 18px 30px;
    display: flex;
    justify-content: space-between;
}

nav a {
    margin-left: 25px;
    text-decoration: none;
    color: var(--soft);
}

nav a:hover {
    color: var(--text);
}

/* OFFSET FIX */
section {
    scroll-margin-top: 100px;
}

/* HERO */
.hero {
    text-align: center;
    padding: 140px 20px;
}

.hero h1 {
    font-size: 3rem;
}

.hero p {
    color: var(--soft);
}

/* TITLES */
.title {
    text-align: center;
    font-size: 2rem;
    margin-top: 120px;
}

.subtitle {
    text-align: center;
    color: var(--soft);
    margin-bottom: 60px;
}

/* GALLERY */
.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px,1fr));
    gap: 25px;
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.gallery img {
    width: 100%;
    border-radius: 10px;
    transition: .4s;
}

.gallery img:hover {
    transform: scale(1.05);
}

/* PRICING */
.pricing {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(280px,1fr));
    gap: 30px;
}

.card {
    border: 1px solid var(--border);
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    transition: .3s;
}

.card:hover {
    transform: translateY(-10px);
}

.price {
    font-size: 2rem;
    margin: 20px 0;
}

button {
    background: black;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
}

/* ABOUT */
.about {
    max-width: 900px;
    margin: auto;
    padding: 20px;
    text-align: center;
}

.about img {
    width: 180px;
    border-radius: 50%;
}

/* CONTACT */
.contact {
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

input, textarea {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: 1px solid var(--border);
}

/* ANIMACIONES */
.hidden {
    opacity: 0;
    transform: translateY(40px);
    transition: all 0.8s ease;
}

.show {
    opacity: 1;
    transform: translateY(0);
}
</style>
</head>

<body>

<header>
<nav>
<div>Fotografía</div>
<div>
<a href="#inicio">Inicio</a>
<a href="#galeria">Galería</a>
<a href="#tarifas">Tarifas</a>
<a href="#sobre">Sobre mí</a>
<a href="#contacto">Contacto</a>
</div>
</nav>
</header>

<section id="inicio" class="hero hidden">
<h1>Fotografía Inmobiliaria</h1>
<p>Imágenes que venden propiedades</p>
</section>

<section id="galeria">
<h2 class="title">Galería</h2>
<p class="subtitle">Espacios con impacto visual</p>

<div class="gallery">
<img src="https://images.unsplash.com/photo-1507089947368-19c1da9775ae?w=1200">
<img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=1200">
<img src="https://images.unsplash.com/photo-1502673530728-f79b4cab31b1?w=1200">
</div>
</section>

<section id="tarifas" class="pricing">
<h2 class="title">Tarifas</h2>

<div class="cards">

<div class="card hidden">
<h3>Básico</h3>
<p class="price">80€</p>
<button onclick="reservar('Piso Básico')">Reservar</button>
</div>

<div class="card hidden">
<h3>Premium</h3>
<p class="price">150€</p>
<button onclick="reservar('Premium')">Reservar</button>
</div>

<div class="card hidden">
<h3>Local</h3>
<p class="price">200€</p>
<button onclick="reservar('Local Comercial')">Reservar</button>
</div>

</div>
</section>

<section id="sobre" class="about hidden">
<h2 class="title">Sobre mí</h2>
<img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=1200">
<p>Especialista en fotografía de interiores y arquitectura.</p>
</section>

<section id="contacto" class="contact hidden">
<h2 class="title">Contacto</h2>

<form>
<input type="text" placeholder="Nombre">
<input type="email" placeholder="Email">
<textarea placeholder="Mensaje"></textarea>
<button>Enviar</button>
</form>

</section>

<script>

/* ANIMACIÓN SCROLL */
const elements = document.querySelectorAll('.hidden');

const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
        if(entry.isIntersecting){
            entry.target.classList.add('show');
        }
    });
});

elements.forEach(el => observer.observe(el));

/* RESERVA WHATSAPP */
function reservar(tipo){
    let mensaje = encodeURIComponent("Hola, quiero reservar el servicio: " + tipo);
    window.open("https://wa.me/34600000000?text=" + mensaje);
}

</script>

</body>
</html>

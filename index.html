<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food & Drink Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0d0d0d; color: white; }

    header {
      height: 100vh;
      background: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    header h1 {
      font-size: 3rem;
      background: rgba(0,0,0,0.5);
      padding: 20px;
    }

    section { padding: 60px 10%; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .card {
      position: relative;
      overflow: hidden;
    }

    .card img {
      width: 100%;
      height: 400px;
      object-fit: cover;
      transition: 0.5s;
    }

    .card:hover img {
      transform: scale(1.1);
    }

    .card h2 {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-size: 1.5rem;
      background: rgba(0,0,0,0.6);
      padding: 10px;
    }

    .about {
      max-width: 700px;
      margin: auto;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 40px;
      background: #111;
    }

    a.button {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: #c0392b;
      color: white;
      text-decoration: none;
    }

  </style>
</head>
<body>

<header>
  <div>
    <h1>Food & Drink Photography</h1>
    <a href="#portfolio" class="button">Ver portfolio</a>
  </div>
</header>

<section id="portfolio">
  <div class="grid">
    <div class="card">
      <img src="https://images.unsplash.com/photo-1541542684-4a3f2f86c3c5">
      <h2>Food</h2>
    </div>
    <div class="card">
      <img src="https://images.unsplash.com/photo-1514361892635-cebbd7c62c0b">
      <h2>Drinks</h2>
    </div>
    <div class="card">
      <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5">
      <h2>Interiors</h2>
    </div>
  </div>
</section>

<section class="about">
  <h2>Sobre mí</h2>
  <p>
    Soy fotógrafo especializado en gastronomía e interiores. Capturo la atmósfera real de cada espacio y la esencia de cada plato.
  </p>
</section>

<footer>
  <p>Contacto: tuemail@email.com</p>
</footer>

</body>
</html>

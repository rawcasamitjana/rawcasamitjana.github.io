<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AJMC Studio | Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Poppins',sans-serif;background:#0a0a0a;color:#fff;overflow-x:hidden}

/* HEADER */
header{position:fixed;width:100%;display:flex;justify-content:space-between;padding:15px 40px;background:rgba(0,0,0,0.6);backdrop-filter:blur(10px);z-index:1000}
.logo{font-weight:600;letter-spacing:3px}
nav a{color:#aaa;margin:0 10px;text-decoration:none;font-size:14px}
nav a:hover{color:#fff}

/* HERO */
.hero{height:100vh;display:flex;justify-content:center;align-items:center;flex-direction:column;text-align:center;background:url('https://images.unsplash.com/photo-1504674900247-0877df9cc836') center/cover}
.hero h1{font-size:clamp(35px,6vw,70px)}
.hero p{opacity:0.8}

section{padding:80px 20px;max-width:1200px;margin:auto}

/* INSTAGRAM GRID */
.grid{column-count:3;column-gap:15px}
.card{break-inside:avoid;margin-bottom:15px;border-radius:12px;overflow:hidden;cursor:pointer;position:relative}
.card img{width:100%;display:block;transition:0.4s}
.card:hover img{transform:scale(1.08)}
.card::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,0.2);opacity:0;transition:0.3s}
.card:hover::after{opacity:1}

/* RESPONSIVE */
@media(max-width:900px){.grid{column-count:2}}
@media(max-width:600px){.grid{column-count:1}}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;display:none;background:rgba(0,0,0,0.95);justify-content:center;align-items:center}
.lightbox img{max-width:90%;max-height:90%}

/* CURSOR */
.cursor{position:fixed;width:20px;height:20px;border:2px solid #fff;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);transition:0.05s}

/* FILTERS */
.filters{text-align:center;margin-bottom:30px}
.filters button{margin:5px;padding:8px 20px;background:#222;border:none;color:#fff;cursor:pointer}
.filters button.active{background:#fff;color:#000}

</style>
</head>

<body>

<div class="cursor" id="cursor"></div>

<header>
<div class="logo">AJMC</div>
<nav>
<a href="#gallery">Galería</a>
</nav>
</header>

<section class="hero">
<h1>Fotografía Premium</h1>
<p>Experiencia visual de alto nivel</p>
</section>

<section id="gallery">
<h2>Galería</h2>

<div class="filters">
<button onclick="filterSelection('all')">Todo</button>
<button onclick="filterSelection('comida')">Comida</button>
<button onclick="filterSelection('bebida')">Bebida</button>
</div>

<div class="grid" id="galleryGrid"></div>
</section>

<div class="lightbox" id="lightbox"><img id="lightbox-img"></div>

<script>

// CURSOR
const cursor=document.getElementById('cursor');
document.addEventListener('mousemove',e=>{
cursor.style.top=e.clientY+'px';
cursor.style.left=e.clientX+'px';
});

// LIGHTBOX
const lightbox=document.getElementById('lightbox');
const lightboxImg=document.getElementById('lightbox-img');

// DATA (tipo app real con categorías)
const images=[
{src:'https://images.unsplash.com/photo-1550547660-d9450f859349',cat:'comida'},
{src:'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38',cat:'comida'},
{src:'https://images.unsplash.com/photo-1509042239860-f550ce710b93',cat:'bebida'},
{src:'https://images.unsplash.com/photo-1510626176961-4b57d4fbad03',cat:'bebida'},
{src:'https://images.unsplash.com/photo-1604908176997-125f25cc6f3d',cat:'comida'},
{src:'https://images.unsplash.com/photo-1544145945-f90425340c7e',cat:'bebida'}
];

const gallery=document.getElementById('galleryGrid');

function loadImages(filter='all'){
gallery.innerHTML='';
images.forEach(imgData=>{
if(filter==='all'||imgData.cat===filter){
let div=document.createElement('div');
div.className='card '+imgData.cat;
let img=document.createElement('img');
img.src=imgData.src;
img.loading='lazy';

div.appendChild(img);
gallery.appendChild(div);

img.onclick=()=>{
lightbox.style.display='flex';
lightboxImg.src=imgData.src;
};
}
});
}

loadImages();

function filterSelection(cat){
loadImages(cat);
}

lightbox.onclick=()=>lightbox.style.display='none';

// SCROLL PARALLAX SUAVE (tipo Apple)
window.addEventListener('scroll',()=>{
document.querySelector('.hero').style.transform=`translateY(${window.scrollY*0.3}px)`;
});

</script>

</body>
</html>
